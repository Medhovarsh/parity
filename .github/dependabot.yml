version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine dev-tool bumps; they move often and rarely
      # independently. Runtime dependencies stay separate so each gets a real
      # review — they ship to users.
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "types-*", "respx", "hypothesis"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
