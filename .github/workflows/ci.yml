name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail loudly rather than silently reaching for a credential that is not there.
  # No job in this workflow may contact a model provider.
  PYTHONWARNINGS: error::DeprecationWarning

jobs:
  quality:
    name: lint · format · types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check --diff .

      - name: Types
        run: mypy

  test:
    name: test ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Parity writes files, sets POSIX permissions, and renders to a terminal.
        # All three behave differently per platform, so all three are tested.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # arm64 coverage. Parity's own wheel is py3-none-any, but its one
          # native dependency (pydantic-core) is architecture-specific, so
          # "works on arm64" is verified rather than assumed.
          # macos-latest is already arm64; these add Linux and Windows on arm.
          - os: ubuntu-24.04-arm
            python: "3.12"
          - os: ubuntu-24.04-arm
            python: "3.13"
          - os: windows-11-arm
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Test
        # The suite is offline by design; no secrets are exposed to this step.
        run: pytest -q

      - name: Smoke test the CLI end to end
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          parity init
          parity capture "$GITHUB_WORKSPACE/examples/interactions.jsonl"
          parity baseline stats
          # The fake provider echoes its input, so the JSON cases necessarily
          # regress. A zero exit here would mean the gate is not gating.
          if parity --quiet gate --candidate fake:fake-1 --format json > report.json; then
            echo "::error::gate passed on a run with known regressions"
            exit 1
          fi
          python -c "import json,sys; d=json.load(open('report.json')); assert d['summary']['broken'] > 0, d"
          parity report --format junit --out parity.xml
          python -c "import xml.etree.ElementTree as ET; ET.parse('parity.xml')"
          echo "CLI smoke test passed"

  package:
    name: build · install · verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Assert the wheel is architecture-independent
        shell: bash
        run: |
          set -euo pipefail
          # Parity is pure Python. A wheel tagged anything other than
          # py3-none-any would mean a compiled artefact crept in and the
          # package silently stopped being portable across architectures.
          wheel="$(ls dist/*.whl)"
          echo "built: $wheel"
          case "$wheel" in
            *-py3-none-any.whl) echo "architecture-independent wheel confirmed" ;;
            *) echo "::error::wheel is not py3-none-any: $wheel"; exit 1 ;;
          esac

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/parity version
          /tmp/verify/bin/parity checks

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
