name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly disclosed advisory in a dependency surfaces without
    # waiting for someone to push.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "." pip-audit

      - name: Audit dependencies
        # Audit a frozen requirements list rather than the live environment.
        # Auditing the environment pulls in the project itself, which is not on
        # PyPI yet, and --strict turns "could not resolve" into a failure.
        # --skip-editable does not help: under --strict a *skipped* dependency
        # is also an error. Freezing with --exclude-editable removes the project
        # and leaves exactly the dependency tree we care about, so --strict can
        # stay on and a genuinely unauditable dependency still fails the build.
        run: |
          pip freeze --exclude-editable > /tmp/audit-requirements.txt
          pip-audit --strict --progress-spinner off -r /tmp/audit-requirements.txt

  static-analysis:
    name: security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && pip install ruff

      - name: Bandit rules via ruff
        run: ruff check --select S --output-format=github .

  no-telemetry:
    name: no-telemetry invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert the only outbound HTTP is a configured provider
        shell: bash
        run: |
          set -euo pipefail
          # Parity promises it makes no network call the user did not ask for.
          # Enforce that mechanically: httpx may only be constructed inside the
          # provider adapters, and no other HTTP client may appear at all.
          offenders="$(grep -rln --include='*.py' -E 'httpx\.|urllib\.request|http\.client|socket\.|requests\.' src/ \
            | grep -v '^src/parity/adapters/providers/' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::network access outside the provider adapters:"
            echo "$offenders"
            exit 1
          fi

          banned="$(grep -rn --include='*.py' -E '\b(pickle|marshal)\b|yaml\.load\(|\beval\(|\bexec\(' src/ || true)"
          if [ -n "$banned" ]; then
            echo "::error::unsafe deserialisation or dynamic execution found:"
            echo "$banned"
            exit 1
          fi

          echo "no-telemetry and safe-deserialisation invariants hold"
