# Install with: pre-commit install
# Run over everything with: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
      - id: detect-private-key
      # Baselines can contain real payloads. Keep them out of commits unless
      # somebody deliberately forces one in.
      - id: forbid-new-submodules

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        # mypy needs the real dependency graph, not an isolated environment.
        additional_dependencies:
          - pydantic>=2.7
          - typer>=0.12
          - types-jsonschema
          - httpx
          - pytest
        args: [--strict]
        pass_filenames: false
