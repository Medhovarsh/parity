[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "parity-ci"
version = "0.1.0"
description = "Behavioral regression gate for non-deterministic LLM systems."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "llm",
    "testing",
    "regression",
    "evaluation",
    "ci",
    "model-migration",
    "governance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13.7",
    "jsonschema>=4.22",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-jsonschema>=4.22",
    "respx>=0.21",
    "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/parity-dev/parity"
Documentation = "https://github.com/parity-dev/parity/tree/main/docs"
Source = "https://github.com/parity-dev/parity"
Issues = "https://github.com/parity-dev/parity/issues"
Changelog = "https://github.com/parity-dev/parity/blob/main/CHANGELOG.md"

[project.scripts]
parity = "parity.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parity"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/CHANGELOG.md"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "A",    # builtin shadowing
    "RET",  # return consistency
    "SIM",  # simplify
    "PTH",  # use pathlib
    "TID",  # tidy imports
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert is fine in this codebase's tests
    "SIM108", # ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B008"]
"src/parity/cli/**" = ["B008"]  # typer uses function-call defaults by design

[tool.ruff.lint.isort]
known-first-party = ["parity"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=parity",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = [
    "network: test requires network access (deselected by default in CI)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/parity"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
